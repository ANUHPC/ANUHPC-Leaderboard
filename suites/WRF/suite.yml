# WRF — Weather Research and Forecasting. placeholder, not wired up yet.
name: WRF
description: Weather Research and Forecasting model
enabled: false
clusters: []          # not wired to any cluster yet

metric:
  key: throughput
  label: Forecast throughput
  unit: sim-h/wall-h
  direction: higher
  precision: 2

inputs:
  required: [namelist.input]
  optional: [namelist.wps, job.yml]

# large static input, staged before a run
data:
  geog: /work/datasets/wrf/WPS_GEOG
  met:  /work/datasets/wrf/met

# preprocessing is separate programs
stages: [geogrid, ungrib, metgrid, real, wrf]

# standard CONUS configs
cases:
  - {slug: conus12km, description: "Standard CONUS 12 km benchmark"}
  - {slug: conus2.5km, description: "Standard CONUS 2.5 km benchmark"}

legacy:
  parse_stdout: true       # timing comes from rsl.error.0000

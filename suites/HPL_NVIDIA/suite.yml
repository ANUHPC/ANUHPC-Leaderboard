# HPL_NVIDIA — High Performance Linpack on GPUs.
# separate from HPL so GPU numbers don't bury the CPU board.
name: HPL_NVIDIA
description: High Performance Linpack on NVIDIA GPUs

metric:
  key: gflops
  label: Rmax
  unit: GFLOP/s
  direction: higher        # bigger is better
  precision: 2

secondary:
  - {key: time,     label: Solve time, unit: s,  direction: lower}
  - {key: residual, label: Residual,   unit: "", direction: lower}

inputs:
  required: [HPL.dat]
  # run.sh (or run.<cluster>.sh) has the #SBATCH lines and gets submitted
  optional: [run.sh]

# xhpl-nvidia ignores the params in `ignored`.
# P x Q = GPU count. with PMAP=1 set P = GPUs per node, the other way round is ~2x slower.
tuning:
  free: [N, NB, P, Q, PMAP, SWAP]
  ignored: [PFACT, RFACT, NBMIN, NDIV, BCAST, DEPTH, L1, U, EQUIL, ALIGN]

# files kept from a run
artifacts:
  HPL.dat: [HPL.dat]
  run.sh:  [run.sh, "run.*.sh"]
  run.out: [run.out, "*.out"]
  run.err: [run.err, "*.err"]
  job.yml: [job.yml]

run:
  launcher: sbatch
  binary: /apps/benchmarks/hpl-nvidia/current/workspace/hpl-linux-x86_64/xhpl
  partition: gpu

# xenon: 2 nodes x 4 A100 40GB. launchpad: 1 node, 2x H100 NVL
clusters: [xenon, launchpad]

limits:
  max_nodes: 2
  max_walltime: "04:00:00"

legacy:
  parse_stdout: true       # same stdout parsing as HPL; no result.json yet

# HPL-NVIDIA 26.02 extracted from the NGC image and run natively (container MPI
# can't bootstrap under this slurm). multi-node needs HPL_USE_NVSHMEM=0, set in run.xenon.sh.
available: true

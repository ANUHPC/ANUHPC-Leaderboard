# HPL — High Performance Linpack
name: HPL
description: High Performance Linpack, the Top500 benchmark

metric:
  key: gflops
  label: Rmax
  unit: GFLOP/s
  direction: higher        # bigger is better
  precision: 2

secondary:
  - {key: time,     label: Solve time, unit: s,  direction: lower}
  - {key: residual, label: Residual,   unit: "", direction: lower}

inputs:
  required: [HPL.dat]
  # run.sh (or run.<cluster>.sh) has the #SBATCH lines and gets submitted
  optional: [run.sh]

# no fixed case list, tuning is the exercise
tuning:
  free: [N, NB, P, Q, PFACT, RFACT, BCAST, DEPTH, SWAP]

# files kept from a run
artifacts:
  HPL.dat: [HPL.dat]
  run.sh:  [run.sh, "run.*.sh"]
  run.out: [run.out, "*.out"]
  run.err: [run.err, "*.err"]
  job.yml: [job.yml]

run:
  launcher: sbatch          # the user's own run.sh is submitted directly
  # launchpad's is /data/benchmarks/hpl/current/bin/xhpl, see HPL_BIN in submit-launchpad.yml
  binary: /apps/benchmarks/hpl/current/bin/xhpl

# launchpad is cpu only here, the H100s are HPL_NVIDIA
clusters: [raijin, xenon, launchpad]

limits:
  max_nodes: 3
  max_walltime: "04:00:00"

# old runs have no result.json and are parsed from stdout, keep this
legacy:
  parse_stdout: true

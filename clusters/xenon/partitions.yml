# Xenon, checked against sinfo and slurm.conf on 2026-09-17. keep in sync with slurm.conf.
# cores_available is what a job can get; cpu-node1 keeps 2 cores for slurmctld.

name: xenon
label: Xenon
description: 4-node cluster, 2x CPU + 2x A100 GPU nodes, 56 Gb FDR InfiniBand
controller: cpu-node1
runner_label: xenon      # GitHub Actions: runs-on [self-hosted, xenon]
status: active

nodes:
  cpu-node1:
    # controller, also a compute node
    sockets: 2
    cores_per_socket: 18
    threads_per_core: 2
    cpus: 72
    cores_total: 36
    cores_reserved: 2          # CoreSpecCount, kept for slurmctld
    cores_available: 34
    memory_mb: 500000
    gpus: 0
  cpu-node2:
    sockets: 2
    cores_per_socket: 18
    threads_per_core: 2
    cpus: 72
    cores_total: 36
    cores_reserved: 0
    cores_available: 36
    memory_mb: 500000
    gpus: 0
  gpu-node1:
    sockets: 2
    cores_per_socket: 16
    threads_per_core: 2
    cpus: 64
    cores_total: 32
    cores_reserved: 0
    cores_available: 32
    memory_mb: 2000000
    gpus: 4
    gpu_model: a100
  gpu-node2:
    sockets: 2
    cores_per_socket: 16
    threads_per_core: 2
    cpus: 64
    cores_total: 32
    cores_reserved: 0
    cores_available: 32
    memory_mb: 2000000
    gpus: 4
    gpu_model: a100

partitions:
  cpu:
    default: true
    nodes: [cpu-node1, cpu-node2]
    max_nodes: 2
    max_walltime: "04:00:00"
    # single node lands on cpu-node2 (36), two nodes must fit cpu-node1 (34)
    cores_per_node_single: 36
    cores_per_node_multi: 34
  gpu:
    default: false
    nodes: [gpu-node1, gpu-node2]
    max_nodes: 2
    max_walltime: "04:00:00"
    gres: "gpu:a100"
    exclusive: true
  all:
    default: false
    nodes: [cpu-node1, cpu-node2, gpu-node1, gpu-node2]
    max_nodes: 4
    max_walltime: "04:00:00"

filesystems:
  apps: /apps
  cluster: /cluster
  work: /work
  scratch: /scratch
  local: /local

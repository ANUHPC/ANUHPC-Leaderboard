# What the Xenon cluster actually offers. Verified against sinfo and
# /etc/slurm/slurm.conf on 2026-09-17. Keep in step with slurm.conf: a job that
# asks for something not listed here is rejected at pull-request time instead of
# failing after it has already queued.
#
# cores_available is the number a JOB can have, which is not cores_total.
# cpu-node1 runs slurmctld, so CoreSpecCount=2 holds back two cores for the
# daemon; asking for all 36 there gets "Requested node configuration is not
# available" from sbatch, before anything queues.

name: xenon
label: Xenon
description: 4-node cluster, 2x CPU + 2x A100 GPU nodes, 56 Gb FDR InfiniBand
controller: cpu-node1
runner_label: xenon      # GitHub Actions: runs-on [self-hosted, xenon]
status: active

nodes:
  cpu-node1:
    # The controller, and since 2026-09-17 also a compute node.
    sockets: 2
    cores_per_socket: 18
    threads_per_core: 2
    cpus: 72
    cores_total: 36
    cores_reserved: 2          # CoreSpecCount, kept for slurmctld
    cores_available: 34
    memory_mb: 500000
    gpus: 0
  cpu-node2:
    # Pure compute: no daemon to protect, so every core goes to jobs. This is
    # the node a single-node HPL run lands on, and where the 793 GFLOP/s
    # baseline was measured.
    sockets: 2
    cores_per_socket: 18
    threads_per_core: 2
    cpus: 72
    cores_total: 36
    cores_reserved: 0
    cores_available: 36
    memory_mb: 500000
    gpus: 0
  gpu-node1:
    sockets: 2
    cores_per_socket: 16
    threads_per_core: 2
    cpus: 64
    memory_mb: 2000000
    gpus: 4
    gpu_model: a100
  gpu-node2:
    sockets: 2
    cores_per_socket: 16
    threads_per_core: 2
    cpus: 64
    memory_mb: 2000000
    gpus: 4
    gpu_model: a100

partitions:
  cpu:
    default: true
    nodes: [cpu-node1, cpu-node2]
    max_nodes: 2
    max_walltime: "04:00:00"
    # The two cpu nodes are NOT identical, and that is deliberate:
    #   single-node  -> 36 (Slurm places it on cpu-node2, which has 36)
    #   two-node     -> 34 (must also fit cpu-node1, which reserves 2)
    # Asking 36 across two nodes is refused up front by sbatch.
    cores_per_node_single: 36
    cores_per_node_multi: 34
  gpu:
    default: false
    nodes: [gpu-node1, gpu-node2]
    max_nodes: 2
    max_walltime: "04:00:00"
    gres: "gpu:a100"
    exclusive: true
  all:
    default: false
    nodes: [cpu-node1, cpu-node2, gpu-node1, gpu-node2]
    max_nodes: 4
    max_walltime: "04:00:00"

filesystems:
  apps: /apps
  cluster: /cluster
  work: /work
  scratch: /scratch
  local: /local

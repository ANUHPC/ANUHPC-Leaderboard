# What the Xenon cluster actually offers. Verified against sinfo and
# /etc/slurm/slurm.conf on 2026-09-17. Keep in step with slurm.conf: a job that
# asks for something not listed here is rejected at pull-request time instead of
# failing after it has already queued.
#
# cores_available is the number a JOB can have, which is not cores_total.
# cpu-node1 runs slurmctld, so CoreSpecCount=2 holds back two cores for the
# daemon; asking for all 36 there gets "Requested node configuration is not
# available" from sbatch, before anything queues.

name: xenon
label: Xenon
description: 4-node cluster, 2x CPU + 2x A100 GPU nodes, 56 Gb FDR InfiniBand
controller: cpu-node1
runner_label: xenon      # GitHub Actions: runs-on [self-hosted, xenon]
status: active

nodes:
  cpu-node1:
    # The controller, and since 2026-09-17 also a compute node.
    sockets: 2
    cores_per_socket: 18
    threads_per_core: 2
    cpus: 72
    cores_total: 36
    cores_reserved: 2          # CoreSpecCount, kept for slurmctld
    cores_available: 34
    memory_mb: 500000
    gpus: 0
  cpu-node2:
    sockets: 2
    cores_per_socket: 18
    threads_per_core: 2
    cpus: 72
    cores_total: 36
    # CoreSpecCount=2 was applied here too, for symmetry with the controller.
    # It costs 2 cores on the node that does the benchmarking and protects
    # nothing (no slurmctld here) -- worth dropping back to 0 if the two
    # cpu nodes do not need to be identical.
    cores_reserved: 2
    cores_available: 34
    memory_mb: 500000
    gpus: 0
  gpu-node1:
    sockets: 2
    cores_per_socket: 16
    threads_per_core: 2
    cpus: 64
    memory_mb: 2000000
    gpus: 4
    gpu_model: a100
  gpu-node2:
    sockets: 2
    cores_per_socket: 16
    threads_per_core: 2
    cpus: 64
    memory_mb: 2000000
    gpus: 4
    gpu_model: a100

partitions:
  cpu:
    default: true
    nodes: [cpu-node1, cpu-node2]
    max_nodes: 2
    max_walltime: "04:00:00"
    # Both cpu nodes currently offer 34 cores to jobs.
    cores_per_node: 34
  gpu:
    default: false
    nodes: [gpu-node1, gpu-node2]
    max_nodes: 2
    max_walltime: "04:00:00"
    gres: "gpu:a100"
    exclusive: true
  all:
    default: false
    nodes: [cpu-node1, cpu-node2, gpu-node1, gpu-node2]
    max_nodes: 4
    max_walltime: "04:00:00"

filesystems:
  apps: /apps
  cluster: /cluster
  work: /work
  scratch: /scratch
  local: /local

# Raijin, the original leaderboard cluster. not reachable from xenon, only via
# its own actions runner.
# specs are guessed from committed runs in output/, not checked on the machines.

name: raijin
label: Raijin
description: 7-node CPU cluster (hpc-01..hpc-07), the original leaderboard target
runner_label: raijin
status: active
derived: true            # specs inferred from committed output, not measured

nodes:
  # no YAML anchors, our yaml reader doesn't support them
  hpc-01:
    sockets: 2
    cores_per_socket: 8
    threads_per_core: 2
    cpus: 32
    memory_mb: null      # unknown, >= ~64000 going by the largest run
    gpus: 0
  hpc-02:
    sockets: 2
    cores_per_socket: 8
    threads_per_core: 2
    cpus: 32
    memory_mb: null      # unknown, >= ~64000 going by the largest run
    gpus: 0
  hpc-03:
    sockets: 2
    cores_per_socket: 8
    threads_per_core: 2
    cpus: 32
    memory_mb: null      # unknown, >= ~64000 going by the largest run
    gpus: 0
  hpc-04:
    sockets: 2
    cores_per_socket: 8
    threads_per_core: 2
    cpus: 32
    memory_mb: null      # unknown, >= ~64000 going by the largest run
    gpus: 0
  hpc-05:
    sockets: 2
    cores_per_socket: 8
    threads_per_core: 2
    cpus: 32
    memory_mb: null      # unknown, >= ~64000 going by the largest run
    gpus: 0
  hpc-06:
    sockets: 2
    cores_per_socket: 8
    threads_per_core: 2
    cpus: 32
    memory_mb: null      # unknown, >= ~64000 going by the largest run
    gpus: 0
  hpc-07:
    sockets: 2
    cores_per_socket: 8
    threads_per_core: 2
    cpus: 32
    memory_mb: null      # unknown, >= ~64000 going by the largest run
    gpus: 0
partitions:
  batch:
    default: true
    nodes: [hpc-01, hpc-02, hpc-03, hpc-04, hpc-05, hpc-06, hpc-07]
    max_nodes: 7
    max_walltime: "24:00:00"

filesystems:
  # unknown
  scratch: null

name: launchpad
label: Launchpad
description: 1-node cluster, 2x Intel Xeon Gold 6548Y+, 2x H100 NVL GPU, 1 TiB RAM
controller: scc-connect-03-gpu01
runner_label: launchpad      # GitHub Actions: runs-on [self-hosted, launchpad]
status: active
scheduler: slurm

nodes:
  scc-connect-03-gpu01:
    sockets: 2
    cores_per_socket: 32
    threads_per_core: 2
    cpus: 128
    cores_total: 64
    cores_reserved: 0
    cores_available: 64
    memory_mb: 1048576
    gpus: 2
    gpu_model: h100_nvl
    gpu_memory_mb: 95830

partitions:
  all:
    default: true
    nodes: [scc-connect-03-gpu01]
    max_nodes: 1
    max_walltime: "24:00:00"
    cores_per_node_single: 64
    cores_per_node_multi: 64

filesystems:
  data: /data

name: Submit jobs (raijin)

# Fires only on a push under input/raijin/, and runs only on a runner labelled
# "raijin". Cluster is the first path segment, so routing needs no file parsing
# and a push can never reach the wrong machine.
#
# The runner MUST carry the "raijin" label or this never matches.

on:
  push:
    branches: [main]
    paths:
      - "input/raijin/**"
  workflow_dispatch:
    inputs:
      suite:
        description: "Suite to submit (HPL, MFC, or all)"
        required: false
        default: "all"
      rerun:
        description: "Re-run jobs that already have results in output/"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # One submission at a time per cluster. Two overlapping runs would fight over
  # the same job directories.
  group: submit-raijin
  cancel-in-progress: false

env:
  CLUSTER: raijin
  SCRATCH_BASE: /scratch/jobs

jobs:
  submit:
    runs-on: [self-hosted, raijin]
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1, ref: main }

      - uses: actions/setup-node@v4
        with: { node-version: "20" }

      - name: Verify runner is on the right cluster
        run: node scripts/verify-runner-cluster.mjs "$CLUSTER"

      - name: Verify the runner account resolves cluster-wide
        # Slurm resolves the submitting user on the controller and on every
        # compute node. An account that exists only where the runner lives makes
        # jobs requeue forever with Reason=BeginTime and no output at all.
        run: |
          set -euo pipefail
          me="$(id -un)"; uid="$(id -u)"
          echo "runner account: $me ($uid)"
          bad=0
          # -N lists one node per line. Without it sinfo emits a COMPRESSED
          # hostlist ("gpu-node[1-2]"), which is not a hostname and makes every
          # ssh below fail, so this check failed on a healthy cluster.
          nodes="$(sinfo -h -N -o '%N' | sort -u)"
          # The [0] is part of the key ("SlurmctldHost[0] = cpu-node1"), so
          # strip whitespace from the value only -- deleting digits turned the
          # controller into "cpu-node".
          ctld="$(scontrol show config 2>/dev/null | awk -F= '/^SlurmctldHost/{gsub(/[[:space:]]/,"",$2); print $2}')"
          for n in $nodes $ctld; do
            [ -n "$n" ] || continue
            got="$(timeout 8 ssh -o BatchMode=yes -o ConnectTimeout=5 "$n" "id -u $me 2>/dev/null" 2>/dev/null || echo MISSING)"
            if [ "$got" != "$uid" ]; then
              echo "::error::$me is $got on $n but $uid here — Slurm jobs will not launch"
              bad=1
            else
              echo "  ok: $n has $me = $uid"
            fi
          done
          [ "$bad" -eq 0 ] || exit 1

      - name: Validate
        run: node scripts/validate-job.mjs

      - name: Stage, submit, wait
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          STAGE="${SCRATCH_BASE}/${GITHUB_RUN_ID}"
          mkdir -p "$STAGE"; echo "STAGE=$STAGE" >> "$GITHUB_ENV"
          n=0
          for jobdir in input/$CLUSTER/*/*/*/; do
            [ -d "$jobdir" ] || continue
            s="$(echo "$jobdir" | cut -d/ -f3)"
            [ "${{ inputs.suite }}" = "all" ] || [ -z "${{ inputs.suite }}" ] || [ "${{ inputs.suite }}" = "$s" ] || continue
            rel="${jobdir#input/$CLUSTER/}"
            # Inputs are kept so every run stays reproducible, which means they
            # are all still here on the next push. Skip anything that already
            # produced results, or each push would re-run the whole history.
            if [ "${{ inputs.rerun }}" != "true" ] && \
               compgen -G "output/$CLUSTER/${rel}"'*.out' > /dev/null 2>&1; then
              echo "skip  $rel (already has results; use the rerun input to force)"
              continue
            fi
            dest="$STAGE/$rel"
            mkdir -p "$dest"; cp -r "$jobdir". "$dest"/
            echo "staged $rel"; n=$((n+1))
          done
          echo "STAGED=$n" >> "$GITHUB_ENV"
          [ "$n" -gt 0 ] || { echo "no jobs for $CLUSTER"; exit 0; }
          bash scripts/submit-jobs.sh "$STAGE" "$CLUSTER" "$GITHUB_RUN_ID"

      - name: Harvest
        if: always()
        run: |
          set -euo pipefail
          [ -d "${STAGE:-}" ] || exit 0
          for jobdir in "$STAGE"/*/*/*/; do
            [ -d "$jobdir" ] || continue
            dest="output/$CLUSTER/${jobdir#$STAGE/}"
            mkdir -p "$dest"
            for f in "$jobdir"*; do
              [ -f "$f" ] || continue
              case "$(basename "$f")" in xhpl|*.o|*.mod) continue ;; esac
              cp "$f" "$dest"/
            done
            echo "harvested ${jobdir#$STAGE/}"
          done

      - name: Commit results
        if: always()
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --prune origin main && git checkout -B main && git pull --no-rebase --no-edit origin main
          # Results only. The input spec stays put so every run is reproducible.
          git add -A output/$CLUSTER/
          if git diff --cached --quiet; then echo "nothing to commit"; else
            git commit -m "$CLUSTER results from run ${GITHUB_RUN_ID} [skip ci]"
            for i in 1 2 3; do git push origin main && break; git pull --no-rebase --no-edit origin main; done
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}

      - name: Clean scratch
        if: always()
        run: rm -rf "${STAGE:-/nonexistent}"

name: Submit jobs

# Replacement for node1.yml, suite-aware and built on the shared filesystem.
#
# NOT YET ENABLED. It is workflow_dispatch only until:
#   1. each cluster's runner carries its cluster label (see clusters/*/partitions.yml)
#   2. the toolchain and benchmark binaries are published on that cluster
# node1.yml stays in place and untouched until this has run green by hand.
#
# ROUTING. Raijin and Xenon are separate machines with no network path between
# them, so each is reached only through its own self-hosted runner. Jobs are
# routed by runner LABEL: a runner registered with the label "xenon" picks up
# the xenon matrix leg. scripts/select-jobs.mjs decides which jobs belong to
# which cluster, so a runner never touches another cluster's work.
#
# What changed versus node1.yml: because every node mounts the same /scratch,
# the whole distribute-to-all-nodes and gather-from-all-nodes machinery is gone,
# along with the "prune xhpl from output" step that only existed to clean up
# after it. Two students pushing at once land in different $RUN_ID directories
# instead of overwriting each other.

on:
  workflow_dispatch:
    inputs:
      cluster:
        description: "Cluster to submit on"
        required: true
        type: choice
        options: [raijin, xenon]
      suite:
        description: "Suite to submit (HPL, MFC, or all)"
        required: false
        default: "all"

permissions:
  contents: write

env:
  SCRATCH_BASE: /scratch/jobs

jobs:
  submit:
    strategy:
      fail-fast: false
      matrix:
        cluster: ["${{ inputs.cluster }}"]
    # The second label routes to that cluster's runner. A runner must be
    # registered with its cluster name as a label for this to match.
    runs-on: [self-hosted, "${{ matrix.cluster }}"]
    timeout-minutes: 480
    steps:
      - name: Reject unauthorized actors
        # node1.yml had a step with this name that only ran three echoes and
        # rejected nothing. This one actually exits.
        run: |
          set -euo pipefail
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "refusing: jobs are only submitted from main (got ${{ github.ref }})"
            exit 1
          fi
          echo "actor=${{ github.actor }} ref=${{ github.ref }} run=${{ github.run_id }}"
          echo "cluster=${{ matrix.cluster }} on runner $(hostname -s)"

      - uses: actions/checkout@v4
        with: { fetch-depth: 1, ref: main }

      - name: Validate before submitting anything
        run: node scripts/validate-job.mjs

      - name: Stage to shared scratch
        run: |
          set -euo pipefail
          STAGE="${SCRATCH_BASE}/${GITHUB_RUN_ID}"
          mkdir -p "$STAGE"
          echo "STAGE=$STAGE" >> "$GITHUB_ENV"
          n=0
          # Only this cluster's jobs. Legacy runs with no job.yml are routed by
          # the --nodelist in their run.sh.
          while IFS= read -r run; do
            [ -n "$run" ] || continue
            s="$(echo "$run" | cut -d/ -f2)"
            [ "${{ inputs.suite }}" = "all" ] || [ "${{ inputs.suite }}" = "$s" ] || continue
            dest="$STAGE/${run#input/}"
            mkdir -p "$dest"
            cp -r "$run"/. "$dest"/
            echo "staged $run -> $dest"
            n=$((n+1))
          done < <(node scripts/select-jobs.mjs "${{ matrix.cluster }}")
          echo "staged $n job(s)"
          echo "STAGED=$n" >> "$GITHUB_ENV"

      - name: Submit and wait
        if: env.STAGED != '0'
        run: |
          set -euo pipefail
          shopt -s nullglob
          : > "$STAGE/joblist.txt"
          for jobdir in "$STAGE"/*/*/*/; do
            jobdir="${jobdir%/}"
            suite="$(basename "$(dirname "$(dirname "$jobdir")")")"
            case "$suite" in
              MFC)
                echo "::group::MFC $(basename "$jobdir")"
                bash suites/MFC/render.sh "$jobdir" "$GITHUB_RUN_ID" || echo "FAILED $jobdir"
                echo "::endgroup::"
                ;;
              HPL)
                script="$(ls "$jobdir"/*.sh 2>/dev/null | head -1)"
                [ -n "$script" ] || { echo "no .sh in $jobdir, skipping"; continue; }
                jid=$(sbatch --parsable --chdir="$jobdir" \
                        --output="$jobdir/run.out" --error="$jobdir/run.err" "$script")
                echo "$jobdir:$jid" >> "$STAGE/joblist.txt"
                ;;
              *) echo "no submit path for suite $suite, skipping" ;;
            esac
          done
          # Wait for anything submitted via sbatch (MFC waits internally via --wait).
          if [ -s "$STAGE/joblist.txt" ]; then
            ids=$(cut -d: -f2 "$STAGE/joblist.txt" | paste -sd,)
            echo "waiting on: $ids"
            while squeue -h -j "$ids" -o "%i" 2>/dev/null | grep -q .; do sleep 15; done
          fi

      - name: Harvest results
        if: always()
        run: |
          set -euo pipefail
          [ -d "${STAGE:-}" ] || { echo "nothing staged"; exit 0; }
          shopt -s nullglob
          for jobdir in "$STAGE"/*/*/*/; do
            jobdir="${jobdir%/}"
            rel="${jobdir#$STAGE/}"
            dest="output/$rel"
            mkdir -p "$dest"
            # Copy results only. The MFC working checkout under $STAGE/mfc is
            # not part of any job directory, so it is never picked up here.
            for f in "$jobdir"/*; do
              [ -f "$f" ] || continue
              case "$(basename "$f")" in xhpl|*.o|*.mod) continue ;; esac
              cp "$f" "$dest"/
            done
            echo "harvested $rel"
          done

      - name: Commit
        if: always()
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --prune origin main && git checkout -B main && git pull --no-rebase --no-edit origin main
          git add -A output/
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Results from ${{ matrix.cluster }} run ${GITHUB_RUN_ID} [skip ci]"
            for i in 1 2 3; do
              git push origin main && break
              git pull --no-rebase --no-edit origin main
            done
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}

      - name: Clean scratch
        if: always()
        run: rm -rf "${STAGE:-/nonexistent}"

name: website.yml
on:
  workflow_dispatch:
  push:
    branches: [main, website]
    paths:
      - "scripts/**"
      - "suites/**"
      - "clusters/**"
      - "package.json"
      # no output/**, results deploy via workflow_run below
      - "src/**"
      - "public/**"
      - "index.html"
      - "vite.config.ts"
  workflow_run:
    # deploy after a submit workflow harvests results
    workflows:
      - "Submit jobs (xenon)"
      - "Submit MFC (xenon)"
      - "Submit jobs (raijin)"
      - "Submit jobs (launchpad)"
      - "Submit MFC (launchpad)"
    types:
      - completed

permissions:
  contents: write

# one deploy at a time, newest wins
concurrency:
  group: website-deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          # full history, run dates and submitters come from git
          fetch-depth: 0
          ref: main
          fetch-tags: false

      # should be a no-op, but a checkout once came back shallow anyway
      - name: Ensure full history
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            echo "::warning::checkout was shallow despite fetch-depth: 0 — unshallowing"
            git fetch --unshallow --quiet
          fi
          echo "history: $(git rev-list --count HEAD) commit(s)"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      # validate.yml only runs on PRs, so check pushes to main here
      - name: Validate job specs
        run: node scripts/validate-job.mjs

      - name: Generate website data from all suite outputs
        run: node scripts/collect.mjs

      - name: Checkout website branch
        uses: actions/checkout@v5
        with:
          ref: website
          path: website-branch

      - name: Cache npm dependencies
        uses: actions/cache@v5
        with:
          path: website-branch/node_modules
          key: npm-${{ hashFiles('website-branch/package-lock.json', 'website-branch/package.json') }}
          restore-keys: npm-

      - name: Sync data/raw into website branch public/
        run: |
          mkdir -p website-branch/public/data
          mkdir -p website-branch/public/raw

          if [ -d "/tmp/hpl-website-data/data" ]; then
            rsync -a --delete "/tmp/hpl-website-data/data/" website-branch/public/data/
          else
            echo "No /tmp/hpl-website-data/data directory to sync"
          fi
          if [ -d "/tmp/hpl-website-data/raw" ]; then
            rsync -a --delete "/tmp/hpl-website-data/raw/" website-branch/public/raw/
          fi

          cd website-branch
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data public/raw
          if git commit -m "Update data artifacts from main [skip ci]"; then
            git push origin website
          else
            echo "No data changes to commit"
          fi

      - name: Install dependencies
        working-directory: website-branch
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci --prefer-offline
          else
            npm install --prefer-offline
          fi

      - name: Build site
        working-directory: website-branch
        run: npm run build
        env:
          CI: true
          BASE_PATH: "/${{ github.event.repository.name }}/"

      # force_orphan below deletes the old bundles, but browsers cache
      # index.html for 10 min and would load a blank page without them
      - name: Keep recently replaced bundles
        run: bash scripts/keep-recent-bundles.sh website-branch/dist/assets

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: website-branch/dist
          publish_branch: gh-pages
          force_orphan: true

name: website.yml
on:
  workflow_dispatch:
  push:
    # Also watch the website branch: a change to the site's own source used to
    # need an unrelated push to main before it would deploy.
    branches: [main, website]
    paths:
      - "scripts/**"
      - "suites/**"
      - "clusters/**"
      - "package.json"
      # output/** is deliberately absent: results are committed by the submit
      # workflows with [skip ci], and the deploy is chained from their
      # completion via workflow_run below. Listing it here would either do
      # nothing or double-deploy.
      - "src/**"
      - "public/**"
      - "index.html"
      - "vite.config.ts"
  workflow_run:
    # Deploy when either cluster has finished harvesting results.
    workflows:
      - "Submit jobs (xenon)"
      - "Submit jobs (raijin)"
    types:
      - completed

permissions:
  contents: write

# One deploy at a time, newest wins. A commit that touches both a job and the
# collector fires this from the push AND again when the submit workflow
# finishes; without this they race and the older one can overwrite the newer
# data. cancel-in-progress keeps the run that has the results.
concurrency:
  group: website-deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          # Full history, not a shallow clone. Dates and submitters are read
          # from git: a job spec is added under input/ by whoever submitted it
          # and the results under output/ when the job finishes, and no run
          # artifact records either (MFC prints no date at all; HPL's own
          # timestamp is present in 73 of 132 Raijin runs). At depth 1 there is
          # one commit, so every run older than this build loses its date and
          # the board cannot be ordered by recency.
          fetch-depth: 0
          ref: main
          fetch-tags: false

      # fetch-depth: 0 above should make this a no-op. It is here because it
      # once was not: a build whose log showed a full fetch still ran collect
      # against a one-commit repository, and every git-derived date came out
      # as that commit's timestamp -- 80 runs apparently finishing in the same
      # second. collect.mjs now detects that shape and drops the dates rather
      # than publishing them, but recovering the history is better than losing
      # it, so ask git directly instead of trusting the checkout.
      - name: Ensure full history
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            echo "::warning::checkout was shallow despite fetch-depth: 0 — unshallowing"
            git fetch --unshallow --quiet
          fi
          echo "history: $(git rev-list --count HEAD) commit(s)"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      # validate.yml is a pull-request gate now, so this is what keeps a
      # direct push to main honest. It is the same script, and it is cheap.
      - name: Validate job specs
        run: node scripts/validate-job.mjs

      - name: Generate website data from all suite outputs
        run: node scripts/collect.mjs

      - name: Checkout website branch
        uses: actions/checkout@v5
        with:
          ref: website
          path: website-branch

      - name: Cache npm dependencies
        uses: actions/cache@v5
        with:
          path: website-branch/node_modules
          key: npm-${{ hashFiles('website-branch/package-lock.json', 'website-branch/package.json') }}
          restore-keys: npm-

      - name: Sync data/raw into website branch public/
        run: |
          mkdir -p website-branch/public/data
          mkdir -p website-branch/public/raw

          if [ -d "/tmp/hpl-website-data/data" ]; then
            rsync -a --delete "/tmp/hpl-website-data/data/" website-branch/public/data/
          else
            echo "No /tmp/hpl-website-data/data directory to sync"
          fi
          if [ -d "/tmp/hpl-website-data/raw" ]; then
            rsync -a --delete "/tmp/hpl-website-data/raw/" website-branch/public/raw/
          fi

          cd website-branch
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data public/raw
          if git commit -m "Update data artifacts from main [skip ci]"; then
            git push origin website
          else
            echo "No data changes to commit"
          fi

      - name: Install dependencies
        working-directory: website-branch
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci --prefer-offline
          else
            npm install --prefer-offline
          fi

      - name: Build site
        working-directory: website-branch
        run: npm run build
        env:
          CI: true
          BASE_PATH: "/${{ github.event.repository.name }}/"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: website-branch/dist
          publish_branch: gh-pages
          force_orphan: true

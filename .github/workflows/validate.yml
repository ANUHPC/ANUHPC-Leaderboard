name: Validate job specs

# Runs on the pull request, where there is no cluster. Everything checked is
# static: the suite definition and cluster/partitions.yml. A job asking for more
# nodes than a partition has now fails here instead of queueing and dying.

# A pull-request gate. It deliberately does NOT run on push to main:
# every submit-<cluster> workflow runs validate-job.mjs as its first step, and
# website.yml runs it before building, so a push to main was validating the
# same tree two or three times and filling the Actions list with duplicates.
on:
  pull_request:
    paths:
      - "input/**"
      - "suites/**"
      - "clusters/**"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 1 }

      - uses: actions/setup-node@v5
        with: { node-version: "22" }

      - name: Validate submitted jobs
        run: node scripts/validate-job.mjs

      - name: Verify MFC ranking and provenance
        run: node --test suites/MFC/collect.test.mjs scripts/lib/mfc-decomp.test.mjs

      # Checks the case registry, which is what a case contribution changes.
      # Runs every contributed case.py for real, at each allowed node/rank
      # count, so a case that crashes, prints something other than a JSON
      # dict, misdeclares its sizing, or produces a grid MFC cannot split
      # fails here rather than after a queue wait on the cluster.
      #
      # This executes code from the pull request. validate.yml runs on
      # `pull_request`, so a fork gets a read-only token and no secrets, and
      # the same file would run on the cluster if merged.
      - name: Validate MFC case registry
        run: node scripts/validate-cases.mjs

      - name: Collector smoke test
        # Proves the collector still parses every committed run before this
        # change can reach main and break the website build.
        run: |
          WEBSITE_DATA_DIR="$RUNNER_TEMP/wd" node scripts/collect.mjs
          node -e '
            const fs=require("fs");
            const i=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/wd/data/index.json","utf8"));
            if (!i.runs.length) { console.error("collector produced no runs"); process.exit(1); }
            const scored=i.runs.filter(r=>r.metric&&Number.isFinite(r.metric.value)).length;
            console.log(`index has ${i.runs.length} runs, ${scored} scored`);
            for (const s of i.suites) {
              if (!s.metric || !s.metric.direction) {
                console.error(`suite ${s.name} has no metric.direction`); process.exit(1);
              }
            }
          '

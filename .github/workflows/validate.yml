name: Validate job specs

# static checks on PRs (no cluster). not run on push to main, the submit
# workflows and website.yml already run validate-job.mjs there.
on:
  pull_request:
    paths:
      - "input/**"
      - "suites/**"
      - "clusters/**"
      - "scripts/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 1 }

      - uses: actions/setup-node@v5
        with: { node-version: "22" }

      - name: Validate submitted jobs
        run: node scripts/validate-job.mjs

      - name: Verify collectors and submission validation
        run: node --test suites/HPL/collect.test.mjs suites/MFC/collect.test.mjs scripts/*.test.mjs scripts/lib/*.test.mjs

      # runs each contributed case.py at every allowed node/rank count.
      # runs PR code, fine since pull_request gives forks no secrets.
      - name: Validate MFC case registry
        run: node scripts/validate-cases.mjs

      - name: Collector smoke test
        # make sure collect still parses every committed run
        run: |
          WEBSITE_DATA_DIR="$RUNNER_TEMP/wd" node scripts/collect.mjs
          node -e '
            const fs=require("fs");
            const i=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/wd/data/index.json","utf8"));
            if (!i.runs.length) { console.error("collector produced no runs"); process.exit(1); }
            const scored=i.runs.filter(r=>r.metric&&Number.isFinite(r.metric.value)).length;
            console.log(`index has ${i.runs.length} runs, ${scored} scored`);
            for (const s of i.suites) {
              if (!s.metric || !s.metric.direction) {
                console.error(`suite ${s.name} has no metric.direction`); process.exit(1);
              }
            }
          '

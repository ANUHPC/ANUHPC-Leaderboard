name: Submit jobs (xenon)

# Fires only on a push under input/xenon/, and runs only on a runner labelled
# "xenon". Cluster is the first path segment, so routing needs no file parsing
# and a push can never reach the wrong machine.
#
# The runner MUST carry the "xenon" label or this never matches.

on:
  push:
    branches: [main]
    paths:
      - "input/xenon/**"
  workflow_dispatch:
    inputs:
      suite:
        description: "Suite to submit (HPL, MFC, or all)"
        required: false
        default: "all"
      rerun:
        description: "Re-run jobs that already have results in output/"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # One submission at a time per cluster. Two overlapping runs would fight over
  # the same job directories.
  group: submit-xenon
  cancel-in-progress: false

env:
  CLUSTER: xenon
  SCRATCH_BASE: /scratch/jobs
  PARTITION: all

jobs:
  submit:
    runs-on: [self-hosted, xenon]
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1, ref: main }

      - uses: actions/setup-node@v4
        with: { node-version: "20" }

      - name: Verify runner is on the right cluster
        run: node scripts/verify-runner-cluster.mjs "$CLUSTER"

      - name: Check the runner account resolves on the compute nodes
        # An account that exists only where the runner lives makes jobs requeue
        # forever with Reason=BeginTime and no output at all -- a baffling
        # symptom worth one cheap probe.
        #
        # This asks Slurm, not ssh. The runner is a no-sudo service account
        # with no home directory and no keys, so an ssh probe could never
        # work; an earlier version of this step tried exactly that and failed
        # on every run, healthy cluster or not.
        #
        # --immediate means a busy cluster skips the check instead of queueing
        # behind someone's four-hour HPL run, so this is advisory only.
        continue-on-error: true
        run: |
          set -uo pipefail
          me="$(id -un)"; uid="$(id -u)"
          echo "runner account: $me ($uid)"
          n="$(sinfo -h -N -o '%N' -p "$PARTITION" 2>/dev/null | sort -u | wc -l)"
          if [ "${n:-0}" -eq 0 ]; then echo "  no nodes in $PARTITION; skipping"; exit 0; fi
          out="$(srun --immediate=10 --quiet --partition="$PARTITION" \
                      --nodes="$n" --ntasks-per-node=1 --time=00:01:00 \
                      id -u 2>&1)" || {
            echo "  could not get an allocation (cluster busy?); skipping"; exit 0; }
          bad="$(echo "$out" | grep -vc "^${uid}$" || true)"
          if [ "${bad:-0}" -ne 0 ]; then
            echo "::warning::$me does not resolve to $uid on every node in $PARTITION:"
            echo "$out" | sed 's/^/    /'
          else
            echo "  ok: $me = $uid on all $n node(s) in $PARTITION"
          fi

      - name: Validate
        run: node scripts/validate-job.mjs

      - name: Stage, submit, wait
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          STAGE="${SCRATCH_BASE}/${GITHUB_RUN_ID}"
          mkdir -p "$STAGE"; echo "STAGE=$STAGE" >> "$GITHUB_ENV"
          n=0
          for jobdir in input/$CLUSTER/*/*/*/; do
            [ -d "$jobdir" ] || continue
            s="$(echo "$jobdir" | cut -d/ -f3)"
            [ "${{ inputs.suite }}" = "all" ] || [ -z "${{ inputs.suite }}" ] || [ "${{ inputs.suite }}" = "$s" ] || continue
            rel="${jobdir#input/$CLUSTER/}"
            # Inputs are kept so every run stays reproducible, which means they
            # are all still here on the next push. Skip anything that already
            # produced results, or each push would re-run the whole history.
            if [ "${{ inputs.rerun }}" != "true" ]; then
              if { [ "$s" = MFC ] && [ "$(node scripts/read-yaml.mjs "output/$CLUSTER/${rel}mfc-status.yml" state 2>/dev/null || true)" = COMPLETED ]; } || \
                 { [ "$s" != MFC ] && compgen -G "output/$CLUSTER/${rel}"'*.out' > /dev/null 2>&1; }; then
                echo "skip  $rel (already completed; use the rerun input to force)"
                continue
              fi
            fi
            dest="$STAGE/$rel"
            mkdir -p "$dest"; cp -r "$jobdir". "$dest"/
            echo "staged $rel"; n=$((n+1))
          done
          echo "STAGED=$n" >> "$GITHUB_ENV"
          [ "$n" -gt 0 ] || { echo "no jobs for $CLUSTER"; exit 0; }
          bash scripts/submit-jobs.sh "$STAGE" "$CLUSTER" "$GITHUB_RUN_ID"

      - name: Harvest
        if: always()
        run: |
          set -euo pipefail
          [ -d "${STAGE:-}" ] || exit 0
          for jobdir in "$STAGE"/*/*/*/; do
            [ -d "$jobdir" ] || continue
            dest="output/$CLUSTER/${jobdir#$STAGE/}"
            mkdir -p "$dest"
            for f in "$jobdir"*; do
              [ -f "$f" ] || continue
              case "$(basename "$f")" in xhpl|*.o|*.mod) continue ;; esac
              cp "$f" "$dest"/
            done
            echo "harvested ${jobdir#$STAGE/}"
          done

      - name: Commit results
        if: always()
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --prune origin main && git checkout -B main && git pull --no-rebase --no-edit origin main
          # Results only. The input spec stays put so every run is reproducible.
          git add -A output/$CLUSTER/
          if git diff --cached --quiet; then echo "nothing to commit"; else
            git commit -m "$CLUSTER results from run ${GITHUB_RUN_ID} [skip ci]"
            for i in 1 2 3; do git push origin main && break; git pull --no-rebase --no-edit origin main; done
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}

      - name: Preserve MFC visualization data
        if: always()
        run: |
          set -euo pipefail
          [ -d "${STAGE:-}" ] || exit 0
          for jobdir in "$STAGE"/MFC/*/*/; do
            [ -f "$jobdir/job.yml" ] || continue
            [ "$(node scripts/read-yaml.mjs "$jobdir/job.yml" visualize false)" = true ] || continue
            dest="${SCRATCH_BASE}/visualizations/${GITHUB_RUN_ID}/MFC/$(basename "$(dirname "$jobdir")")/$(basename "$jobdir")"
            mkdir -p "$(dirname "$dest")"
            mv "$jobdir" "$dest"
            echo "MFC visualization data: \`$dest\`" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Clean scratch
        if: always()
        run: rm -rf "${STAGE:-/nonexistent}"

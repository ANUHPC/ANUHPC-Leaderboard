# Small ranked CPU benchmark. Copy ONLY this file to:
# input/xenon/MFC/<your-name>/<new-run-name>/job.yml
# Commit to main (or merge a PR) to submit through GitHub Actions.
# No case.py or run.sh is needed. See README.md in this template directory.
suite: MFC
case: 5eq_rk3_weno3_hllc
visualize: false
resources:
  partition: cpu          # haswell build; never use partition all
  nodes: 1                # 1 or 2
  tasks_per_node: 4        # total ranks = nodes * tasks_per_node
  walltime: "01:00:00"
build:
  gpu: none
  toolchain: gcc-ompi5
tuning:
  gbpp: 1                 # modest CPU grid; increase deliberately
# Grind time: ns/gp/eq/rhs, LOWER is better.
# For GPUs use gpu/job.yml. For SCC26 Problem 3 use practice-problem3/.
# case_optimization and OpenMP GPU offload are not supported by this pipeline.

# HPL on Xenon, cpu-node2.
#
# N=150000 puts the matrix at ~180 GB of cpu-node2's 500 GB. Larger N would
# score higher (HPL efficiency rises with memory occupancy) but takes hours;
# this is a real entry at roughly 40 minutes.
suite: HPL
resources:
  partition: cpu
  nodes: 1
  tasks_per_node: 4
  cpus_per_task: 9        # 4 x 9 = 36 physical cores; SMT siblings left idle
  walltime: "02:00:00"
